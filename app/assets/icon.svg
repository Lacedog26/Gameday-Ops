  <ellipse cx="39"    cy="38.12" rx="5.5" ry="10" fill="#F0960A" transform="rotate(150, 39,    38.12)"/>
  <ellipse cx="32"    cy="40"    rx="5.5" ry="10" fill="#F5A623" transform="rotate(180, 32,    40)"/>
  <ellipse cx="25"    cy="38.12" rx="5.5" ry="10" fill="#FFB833" transform="rotate(210, 25,    38.12)"/>
  <ellipse cx="19.88" cy="33"    rx="5.5" ry="10" fill="#F0960A" transform="rotate(240, 19.88, 33)"/>
