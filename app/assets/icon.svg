  <circle cx="34"   cy="29.5" r="0.9" fill="#A0703E" opacity="0.7"/>
  <circle cx="30"   cy="29"   r="0.9" fill="#8B5E3C" opacity="0.7"/>
  <circle cx="28.5" cy="24"   r="0.9" fill="#A0703E" opacity="0.7"/>
  <circle cx="35.5" cy="26"   r="0.9" fill="#8B5E3C" opacity="0.7"/>
  <circle cx="32"   cy="29"   r="0.9" fill="#A0703E" opacity="0.7"/>

  <!-- Center sheen -->
  <circle cx="29.5" cy="23" r="2.5" fill="rgba(255,255,255,0.08)"/>
