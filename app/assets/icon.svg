  <ellipse cx="41.74" cy="28.61" rx="4.4" ry="7" fill="#F5C842" transform="rotate(105, 41.74, 28.61)"/>
  <ellipse cx="39.13" cy="33.13" rx="4.4" ry="7" fill="#FFDD44" transform="rotate(135, 39.13, 33.13)"/>
