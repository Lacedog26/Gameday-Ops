  <ellipse cx="39"    cy="13.88" rx="5.5" ry="10" fill="#FFB833" transform="rotate(30,  39,    13.88)"/>
  <ellipse cx="44.12" cy="19"    rx="5.5" ry="10" fill="#F0960A" transform="rotate(60,  44.12, 19)"/>

