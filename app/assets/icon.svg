  <!-- Leaf right -->
  <path d="M 33 46 Q 44 42 46 38 Q 42 44 34 47" fill="#6BAF4B"/>
  <!-- Leaf left -->
  <path d="M 31 50 Q 20 48 18 44 Q 22 49 30 51" fill="#7BC55A"/>

