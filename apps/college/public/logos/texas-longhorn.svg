<svg xmlns="http://www.w3.org/2000/svg" width="260" height="200" viewBox="0 0 260 200" role="img" aria-label="Texas longhorn mark">
  <!-- Long, sweeping horns (generic longhorn emblem — not an official team logo) -->
  <g fill="none" stroke="#BF5700" stroke-width="20" stroke-linecap="round">
    <path d="M130 96 C 104 92, 74 96, 46 84 C 26 75, 16 54, 22 34"/>
    <path d="M130 96 C 156 92, 186 96, 214 84 C 234 75, 244 54, 238 34"/>
  </g>
  <!-- Bull head + snout -->
  <path d="M130 78
           C 112 78, 100 90, 100 110
           C 100 118, 103 126, 108 132
           C 112 150, 120 168, 130 180
           C 140 168, 148 150, 152 132
           C 157 126, 160 118, 160 110
           C 160 90, 148 78, 130 78 Z" fill="#BF5700"/>
  <!-- Ears -->
  <path d="M100 100 C 84 92, 70 96, 64 108 C 80 108, 92 104, 101 110 Z" fill="#BF5700"/>
  <path d="M160 100 C 176 92, 190 96, 196 108 C 180 108, 168 104, 159 110 Z" fill="#BF5700"/>
  <!-- Nostrils (negative space) -->
  <ellipse cx="122" cy="150" rx="3.6" ry="6" fill="#0b0b0c" opacity="0.55"/>
  <ellipse cx="138" cy="150" rx="3.6" ry="6" fill="#0b0b0c" opacity="0.55"/>
</svg>
