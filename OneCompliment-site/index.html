<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0C0C0C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FEFDF8" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="One compliment. Every day. A daily topic that makes the people around you feel seen." />
    <link rel="icon" type="image/svg+xml" href="./public/icon.svg" />
    <title>OneC🌻mpliment — One compliment. Every day.</title>

    <!-- Open Graph / iMessage / WhatsApp / Slack / Facebook link preview.
         Without these, link previews fall back to <title>, which on a
         /c/:id share showed the static "Today's Challenge" string the
         designer flagged. Per-page overrides for /c/:id are set in
         Compliment.tsx via document.title. og:image points at the
         existing icon SVG — most modern previewers render it; for the
         best fidelity on older iMessage clients, drop a 1200x630 PNG
         at /public/og-card.png and swap the href below. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OneCompliment" />
    <meta property="og:title" content="OneC🌻mpliment — Tap to see who lifted you" />
    <meta property="og:description" content="A daily topic. One specific, real compliment a day. Free forever." />
    <meta property="og:image" content="https://onecompliment.app/icon.svg" />
    <meta property="og:url" content="https://onecompliment.app/" />

    <!-- Twitter Card — same fields, distinct tag namespace. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OneC🌻mpliment — Tap to see who lifted you" />
    <meta name="twitter:description" content="A daily topic. One specific, real compliment a day. Free forever." />
    <meta name="twitter:image" content="https://onecompliment.app/icon.svg" />

    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
